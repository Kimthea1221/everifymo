<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 280px;
            padding: 16px;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .header {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-bottom: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .status-box {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .registered {
            background: #e8f5e9;
            border: 1px solid #1D9E75;
            color: #1D9E75;
        }

        .not-registered {
            background: #fdecea;
            border: 1px solid #D85A30;
            color: #D85A30;
        }

        .unknown {
            background: #f5f5f5;
            border: 1px solid #888;
            color: #555;
        }

        .status-label {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .product-name {
            font-size: 13px;
            color: #333;
            margin-bottom: 6px;
        }

        .detail {
            font-size: 12px;
            color: #666;
        }

        .waiting {
            color: #888;
            font-size: 13px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header">🔍 eVerifyMo — FDA Checker</div>
    <div id="content">
        <div class="waiting">
            Navigate to a product page to see FDA verification results.
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
