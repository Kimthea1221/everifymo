<!-- Auth.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-VERIFY | Sign In</title>
  <link rel="stylesheet" href="../css/global.css" />
</head>
<body>
  <main class="auth-card">
    <div class="header-row">
      <div class="header-left">
        <img
          src="../assets/images/extension_icon.png"
          alt="E-VERIFY Logo"
          class="logo-placeholder"
          width="36"
          height="36"
        />
        <h1 class="header-title">E-Verify</h1>
      </div>
    </div>

    <div class="notice-banner">
      <div>
        <p class="notice-title" id="auth-notice-title">Signing in is optional</p>
        <p class="notice-text" id="auth-notice-text">You can still verify products and submit complaints as a guest. Sign in or Sign up to view your verification history, complaints, and report status.</p>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Authentication tabs">
      <button class="tab-button active" type="button" data-auth-mode="signin" aria-selected="true">Sign In</button>
      <button class="tab-button inactive" type="button" data-auth-mode="signup" aria-selected="false">Sign up</button>
    </div>

    <div class="field" id="signup-username-field" hidden>
      <div class="field-row">
        <label class="field-label" for="username">USERNAME</label>
      </div>
      <div class="input-wrap">
        <img src="../assets/images/username_icon.png" class="icon-placeholder-username" alt="Username Icon">
        <input id="username" class="auth-input username-input" type="text" placeholder="Choose a username" />
      </div>
      <div class="field-error" id="username-error" aria-live="polite"></div>
    </div>

    <div class="field" id="email-field">
      <div class="field-row">
        <label class="field-label" for="email">EMAIL</label>
      </div>
      <div class="input-wrap">
        <img src="../assets/images/email_icon.png" class="icon-placeholder-email" alt="Email Icon">
        <input id="email" class="auth-input" type="email" placeholder="Enter Email" />
      </div>
      <div class="field-error" id="email-error" aria-live="polite"></div>
    </div>

    <div class="field" id="signin-password-field">
      <div class="field-row">
        <label class="field-label" for="password">PASSWORD</label>
        <a href="#" class="forgot-link">Forgot?</a>
      </div>
      <div class="input-wrap">
        <img src="../assets/images/lock_icon.png" class="icon-placeholder-password" alt="Password Icon">
        <input id="password" class="auth-input password-input" type="password" placeholder="Enter Password" />
        <button type="button" class="icon-placeholder-eye toggle-password-visibility" data-target="password" aria-label="Show password">
          <img src="../assets/images/eye_open_icon.png" class="eye-icon" alt="" />
        </button>
      </div>
      <div class="field-error" id="password-error" aria-live="polite"></div>
    </div>

    <div class="signup-password-fields" id="signup-password-fields" hidden>
      <div class="field">
        <div class="field-row">
          <label class="field-label" for="create-password">CREATE PASSWORD</label>
        </div>
        <div class="input-wrap">
          <img src="../assets/images/lock_icon.png" class="icon-placeholder-password" alt="Password Icon">
          <input id="create-password" class="auth-input password-input" type="password" placeholder="Create a password" />
          <button type="button" class="icon-placeholder-eye toggle-password-visibility" data-target="create-password" aria-label="Show password">
            <img src="../assets/images/eye_open_icon.png" class="eye-icon" alt="" />
          </button>
        </div>
        <div class="field-error" id="create-password-error" aria-live="polite"></div>
      </div>

      <div class="field">
        <div class="field-row">
          <label class="field-label" for="confirm-password">CONFIRM PASSWORD</label>
        </div>
        <div class="input-wrap">
          <img src="../assets/images/lock_icon.png" class="icon-placeholder-password" alt="Password Icon">
          <input id="confirm-password" class="auth-input password-input" type="password" placeholder="Confirm your password" />
          <button type="button" class="icon-placeholder-eye toggle-password-visibility" data-target="confirm-password" aria-label="Show password">
            <img src="../assets/images/eye_open_icon.png" class="eye-icon" alt="" />
          </button>
        </div>
        <div class="field-error" id="confirm-password-error" aria-live="polite"></div>
      </div>
    </div>

      <div class="signup-password-fields" id="forgot-password-fields" hidden>
        <div class="field">
          <div class="field-row">
            <label class="field-label" for="new-password">NEW PASSWORD</label>
          </div>
          <div class="input-wrap">
            <img src="../assets/images/lock_icon.png" class="icon-placeholder-password" alt="Password Icon">
            <input id="new-password" class="auth-input password-input" type="password" placeholder="Enter new password" />
            <button type="button" class="icon-placeholder-eye toggle-password-visibility" data-target="new-password" aria-label="Show password">
              <img src="../assets/images/eye_open_icon.png" class="eye-icon" alt="" />
            </button>
          </div>
          <div class="field-error" id="new-password-error" aria-live="polite"></div>
        </div>

        <div class="field">
          <div class="field-row">
            <label class="field-label" for="confirm-new-password">CONFIRM NEW PASSWORD</label>
          </div>
          <div class="input-wrap">
            <img src="../assets/images/lock_icon.png" class="icon-placeholder-password" alt="Password Icon">
            <input id="confirm-new-password" class="auth-input password-input" type="password" placeholder="Confirm new password" />
            <button type="button" class="icon-placeholder-eye toggle-password-visibility" data-target="confirm-new-password" aria-label="Show password">
              <img src="../assets/images/eye_open_icon.png" class="eye-icon" alt="" />
            </button>
          </div>
          <div class="field-error" id="confirm-new-password-error" aria-live="polite"></div>
        </div>
      </div>

      <div class="field" id="otp-field" hidden>
        <div class="field-row">
          <label class="field-label">VERIFICATION CODE</label>
        </div>
        <p class="notice-text" style="margin-top: 0; margin-bottom: 8px;">Enter 6-digit code</p>
        <div class="otp-input-group">
          <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" data-otp-index="0" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" data-otp-index="1" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" data-otp-index="2" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" data-otp-index="3" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" data-otp-index="4" />
          <input type="text" inputmode="numeric" maxlength="1" class="otp-digit-input" data-otp-index="5" />
        </div>
        <div class="field-error" id="otp-error" aria-live="polite"></div>
        <p class="notice-text" id="otp-dev-preview" style="margin-top: 8px;"></p>
      </div>

    <button class="btn-primary-green" type="button" id="auth-primary-button">Sign In</button>

    <!---Sign in with google button and sign in error notification/msg -->
    <button id="google-login-btn">Sign in with Google</button>
    <div class="field-error" id="googleError" aria-live="polite"></div>

    <button class="btn-primary-green hidden" type="button" id="forgot-confirm-button">Confirm</button>
    <a href="#" id="back-to-signin-link" class="forgot-link back-to-signin-link hidden">Back to Sign In</a>

    <button class="btn-primary-green hidden" type="button" id="otp-verify-button">Verify and Sign In</button>
    <div class="otp-links-row">
      <a href="#" id="resend-otp-link" class="forgot-link" hidden>Resend code</a>
      <a href="#" id="back-from-otp-link" class="forgot-link" hidden>Back to Sign In</a>
    </div>

    <div class="or-divider" aria-hidden="true">
      <div class="or-line"></div>
      <div class="or-text">OR</div>
      <div class="or-line"></div>
    </div>

    <button class="btn-guest" type="button" id="btn-guest">
      <div class="icon-placeholder-guest" aria-hidden="true"></div>
      <span>Continue as Guest</span>
    </button>
  </main>

  <script src="../utils/api.js"></script>
  <script src="../scripts/session.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
